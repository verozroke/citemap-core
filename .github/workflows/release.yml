# Continuous delivery: pushing a version tag such as v0.1.0 re-runs the tests
# on the tagged commit, builds the package and publishes a GitHub Release with
# the wheel and source archive attached.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with development tools
        run: python -m pip install -e ".[dev]"

      - name: Check that the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c 'import citemap; print(citemap.__version__)')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package version $VERSION"
            exit 1
          fi

      - name: Run the full test suite on the tagged commit
        run: pytest --cov

      - name: Build sdist and wheel
        run: |
          python -m build
          twine check --strict dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "citemap-core $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
